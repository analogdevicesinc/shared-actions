name: Cloudsmith Upload Raw
description: Upload raw packages to Cloudsmith (S3)

inputs:
  gh-token:
    description: 'GitHub Token'
    default: ${{ github.token }}
  path:
    description: 'Artifact path'
    required: true
  name:
    description: 'Artifact name, default is path basename'
    required: false
  version:
    description: "Artifact version"
    required: true
  tags:
    description: 'Tags to add to artifact, defaults to github context'
    required: false
  namespace:
    description: 'Cloudsmith namespace'
    required: true
  repository:
    description: 'Cloudsmith repository name'
    required: true
  api-key:
    description: 'Cloudsmith API Key'
    required: false
  service-slug:
    description: 'Cloudsmith Service Slug for OIDC'
    required: false

runs:
  using: composite
  steps:
    - name: Get tags
      id: get_tags
      shell: bash
      run: |
        # Get tags
        if [[ -n "${{ inputs.tags }}" ]]; then
          echo "tags=${{ inputs.tags }}" >> "$GITHUB_OUTPUT"
        else
          # push: refs/heads/<branch>
          # tag || release: refs/tags/<tag>
          # pull_request: refs/pull/<id>/merge
          tags="${{ github.ref }}, on/${{ github.event_name }}"
          [[ "${{ github.ref }}" == refs/pull/* ]] && \
            tags+=", refs/heads/${{ github.head_ref }}, refs/base/${{ github.base_ref }}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
        fi

    - uses: analogdevicesinc/shared-actions/cloudsmith-auth@main
      with:
        namespace: ${{ inputs.namespace }}
        service-slug: ${{ inputs.service-slug }}
        api-key: ${{ inputs.api-key }}

    - name: Cloudsmith upload raw
      shell: bash
      if: ${{ env.CLOUDSMITH_API_KEY != '' }}
      run: |
        # Cloudsmith upload raw
        cs-package-upload()
        {
          package_file=$(curl -fL \
            -T "$4" \
            -H "X-Api-Key: $1" \
            -H "Content-Sha256: $(shasum -a256 $4 | cut -f1 -d' ')" \
            "https://upload.cloudsmith.io/$2/$3/$(basename $4)" | jq -r .identifier)
          [ -n "$5" ] && echo "$5=$package_file" >> "$GITHUB_ENV"
          echo "$package_file"
        }

        cs-package-store-raw () {
          curl -sfL \
            -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $1" \
            -d "{\"package_file\":\"$4\", \
                 \"republish\":\"true\", \
                 \"name\":\"$5\", \
                 \"tags\": \"$6\", \
                 \"version\":\"$7\"}" \
            "https://api.cloudsmith.com/v1/packages/$2/$3/upload/raw/"
        }

        name="${{ inputs.name }}"
        [ -z "$name" ] && name=$(basename "${{ inputs.path }}")

        package_file=$(
          cs-package-upload "${{ env.CLOUDSMITH_API_KEY }}" \
                            "${{ inputs.namespace }}" \
                            "${{ inputs.repository }}" \
                            "${{ inputs.path }}"
        )

        cs-package-store-raw "${{ env.CLOUDSMITH_API_KEY }}" \
                             "${{ inputs.namespace }}" \
                             "${{ inputs.repository }}" \
                             "$package_file" \
                             "$name" \
                             "${{ steps.get_tags.outputs.tags }}" \
                             "${{ inputs.version }}"

