name: Test copyright-license-check action

on:
  push:
    branches:
      - main
    paths:
      - 'copyright-license-check/**'
      - '.github/workflows/copyright-license-check-test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'copyright-license-check/**'
      - '.github/workflows/copyright-license-check-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install bats
        run: npm install --save-dev bats

      - name: Run bats tests
        run: npx bats copyright-license-check/tests/check-copyright-license.bats
