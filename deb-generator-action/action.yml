name: Build Debian Package

description: >-
  Build a debian package from source. Expects the standard packaging layout:
  packaging/debian/ with @VERSION@ and @DATE@ placeholders in changelog.
  Build dependencies are auto-installed from packaging/debian/control.

inputs:
  version:
    description: 'Version string (e.g., 1.2.3)'
    required: true
  working-directory:
    description: 'Path to source code (relative to $GITHUB_WORKSPACE)'
    required: false
    default: '.'
  control-path:
    description: 'Path to the debian control files/templates (relative to working-directory)'
    required: false
    default: 'packaging/debian'
  ignore-path:
    description: 'Newline-separated paths to exclude from the orig tarball (beyond .git and debian)'
    required: false
    default: ''

outputs:
  artifact-dir:
    description: 'Path to the directory containing built debian artifacts'
    value: ${{ steps.artifacts.outputs.artifact-dir }}

runs:
  using: 'composite'
  steps:
    - name: Build debian package
      shell: bash
      # All GitHub expressions are bound to env vars (never interpolated
      # directly into the run script) so untrusted input cannot be injected
      # into the shell. ACTION_PATH is set by the runner, not by the caller.
      env:
        VERSION: ${{ inputs.version }}
        WORKING_DIRECTORY: ${{ github.workspace }}/${{ inputs.working-directory }}
        CONTROL_PATH: ${{ inputs.control-path }}
        IGNORE_PATH: ${{ inputs.ignore-path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        chmod +x "$ACTION_PATH/build-deb.sh"
        "$ACTION_PATH/build-deb.sh"

    - name: Set artifact directory output
      id: artifacts
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
      run: echo "artifact-dir=$WORKSPACE/artifacts" >> "$GITHUB_OUTPUT"
